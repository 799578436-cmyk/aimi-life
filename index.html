<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>艾米人生管理系统 · 精简版 1.2</title>
<style>
:root{
  --bg:#f5f9f6; --card:#ffffff; --ink:#31514a; --sub:#7d9890; --line:#e2ece6;
  --pri:#3aa887; --pri2:#6bc7a8; --ok:#54b376; --warn:#efb03c; --bad:#e2645c;
  --soft:#e8f5ef; --sky:#5baed1; --sky-soft:#e7f2f8;
  --peach:#f1a35a; --peach2:#f8cd95; --peach-soft:#fdf0e0;
  --pri-soft:rgba(58,168,135,.14);
  --r:16px; --sh:0 10px 26px rgba(70,140,115,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color:var(--ink);font-size:14.5px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(110,160,150,.10) 1px,transparent 1.4px);
  background-size:22px 22px;}
body{padding-bottom:env(safe-area-inset-bottom);}
svg{display:inline-block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);
  width:100%;padding:11px 12px;border:1.5px solid #e2e7e2;border-radius:12px;background:#fcfdfb;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:64px}
textarea.auto{resize:none;overflow-y:hidden}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 14px;border-radius:13px 11px 14px 12px/11px 14px 12px 13px;
  background:var(--pri);color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 4px 12px rgba(58,168,135,.25);transition:transform .12s,box-shadow .15s}
.btn svg{width:16px;height:16px;flex:none}
.btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none}
.btn.soft{background:var(--soft);color:var(--pri);box-shadow:none}
.btn.gray{background:#eef1ee;color:var(--sub);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,var(--peach),var(--peach2));color:#fff;box-shadow:0 4px 12px rgba(241,163,90,.28)}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f0c4c1;box-shadow:none}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:10px 9px 11px 10px/9px 11px 10px 10px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* layout */
.top{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(247,249,245,.92);backdrop-filter:blur(10px);
  border-bottom:1.5px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.toprow{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;color:var(--ink)}
.logo .mk{width:30px;height:30px;border-radius:10px 8px 11px 9px/9px 11px 8px 10px;
  background:linear-gradient(135deg,var(--peach),var(--peach2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.topside{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hint{background:var(--peach-soft);border:1.5px dashed #eecfae;color:#b5713f;padding:9px 12px;border-radius:12px;font-size:13px;margin:10px 0;display:flex;align-items:center;gap:8px}
.hint svg{width:16px;height:16px;flex:none}
.warn-hint{background:#fdeceb;border:1.5px dashed #f3c0bd;color:#bd4f4a}

/* sidebar */
.side{position:fixed;left:0;top:calc(58px + env(safe-area-inset-top));bottom:0;width:212px;z-index:30;
  background:#ffffff;border-right:1.5px solid var(--line);padding:12px 10px;overflow-y:auto}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8.5px 12px;border-radius:12px 10px 13px 11px/10px 13px 11px 12px;color:var(--sub);font-size:13px;font-weight:600;margin-bottom:2px;transition:background .15s,color .15s}
.side button svg{width:16px;height:16px;flex:none}
.side button.on{background:var(--soft);color:var(--pri)}
.side .grp{font-size:10px;color:#a6b0ab;font-weight:800;padding:12px 12px 5px;letter-spacing:1px}

.wrap{max-width:1180px;margin:0 auto;padding:calc(72px + env(safe-area-inset-top)) 14px 90px 228px}

/* bottom nav (mobile) */
.botnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1.5px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));overflow-x:auto;-webkit-overflow-scrolling:touch}
.botnav button{flex:0 0 auto;min-width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;color:var(--sub);font-size:10px;font-weight:600}
.botnav button svg{width:19px;height:19px}
.botnav button.on{color:var(--pri)}

/* cards */
.card{background:var(--card);border:1.5px solid var(--line);
  border-radius:18px 16px 19px 17px/16px 19px 17px 18px;box-shadow:var(--sh);padding:15px;margin-bottom:13px;position:relative}
.card h3{margin:0 0 11px;font-size:15.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:2px dashed #e3eae6}
.card h3 .ic,.card h3>svg{width:16px;height:16px;color:var(--pri);flex:none}
.quick .qk-ic svg,.quick .qk-ic{width:18px;height:18px}
.card h3 .sub{margin-left:auto;font-size:11px;color:var(--sub);font-weight:600}
.sec>svg,.hint>svg{width:15px;height:15px;flex:none;color:var(--pri)}

/* quick entry / welcome */
.welcome{background:linear-gradient(180deg,#fff,#f9fdfa);border:1.5px dashed #c8e2d8}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px}
.quick button{background:#fff;border:1.5px solid var(--line);border-radius:15px 12px 16px 13px/12px 16px 13px 14px;padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);transition:transform .12s,border-color .15s,background .15s;box-shadow:0 3px 8px rgba(80,140,115,.06)}
.quick button:active{transform:translateY(2px)}
.quick button:hover{border-color:var(--pri);background:var(--soft)}
.quick .qk-ic{width:20px;height:20px;color:var(--pri)}
.quick .qk-ic svg{width:20px;height:20px}
@media(max-width:560px){.quick{grid-template-columns:repeat(2,1fr)}}

/* nav groups clearer */
.side .grp{color:var(--pri);font-weight:800;letter-spacing:1px;font-size:10px;text-transform:uppercase;margin-top:6px}
.botnav button.on{background:var(--soft);border-radius:12px 10px 13px 11px/10px 13px 11px 12px}
.botnav button svg{margin-bottom:1px}
.botnav button{min-width:58px;font-size:10px}
.botnav button svg{width:18px;height:18px}

/* smaller icon defaults */
svg{vertical-align:middle}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.side{display:none}.wrap{padding-left:14px;padding-bottom:84px}.botnav{display:flex}}
@media(max-width:560px){.topside .btn{padding:0 10px;font-size:13px}}

/* today */
.today{border:1.5px solid #f3c9c6;background:linear-gradient(180deg,#fff,#fdf3f1)}
.today h3 .ic,.today h3>svg{color:var(--bad)}
.todo{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.todo:last-child{border-bottom:none}
.todo .tag{font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.tag.over{background:#fadcd9;color:var(--bad)}
.tag.today{background:var(--sky-soft);color:var(--sky)}
.tag.soon{background:var(--peach-soft);color:#b5713f}
.todo .body{flex:1;min-width:0}
.todo .tt{font-weight:600;font-size:14px}
.todo .tt.done{text-decoration:line-through;color:var(--sub)}
.todo .meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.dot{width:21px;height:21px;border-radius:7px;border:2px solid var(--line);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff}
.dot svg{width:13px;height:13px}
.dot.done{background:var(--ok);border-color:var(--ok)}

/* stat */
.stat{background:var(--soft);border:1.5px solid #dcebe7;border-radius:13px;padding:9px 8px;text-align:center;min-width:0}
.stat .n{font-size:17px;font-weight:800;color:var(--pri);line-height:1.1}
.stat .l{font-size:10.5px;color:var(--sub);margin-top:3px}
.stat .n.ok{color:var(--ok)} .stat .n.bad{color:var(--bad)} .stat .n.warn{color:var(--warn)}

/* list items */
.item{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1.5px solid var(--line);border-radius:14px 12px 15px 13px/12px 15px 13px 14px;background:#fff;margin-bottom:9px;flex-wrap:wrap}
.item .body{flex:1;min-width:160px}
.item .tt{font-weight:700;font-size:14px}
.item .meta{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.55}
.item .ops{display:flex;gap:6px;flex:none;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.chip.pri{background:var(--soft);color:var(--pri)}
.chip.ok{background:#e7f4e7;color:var(--ok)}
.chip.warn{background:var(--peach-soft);color:#b5713f}
.chip.gray{background:#eef1ee;color:var(--sub)}
.chip.gold{background:var(--peach-soft);color:#b5713f}
.st{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.st.s0{background:var(--soft);color:var(--pri)}.st.s1{background:var(--peach-soft);color:#b5713f}.st.s2{background:var(--sky-soft);color:var(--sky)}.st.s3{background:#eef1ee;color:var(--sub)}

.fld{margin-bottom:10px}
.fld:last-child{margin-bottom:0}
.fld label{font-size:12px;color:var(--sub);display:block;margin-bottom:5px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.rw{display:flex;gap:8px;align-items:center}
.muted{color:var(--sub);font-size:12.5px}
.cap{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.cap.ok{background:#e7f4e7;color:var(--ok)} .cap.full{background:#fadcd9;color:var(--bad)}
textarea.mini{min-height:44px;font-size:14px;padding:9px 11px}
.sec{font-size:12.5px;font-weight:800;color:var(--pri);margin:6px 0 9px;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.tip{background:#f3f8f5;border:1px dashed #d6e6df;border-radius:12px;padding:9px 11px;font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kvs .k{color:var(--sub)}
.avatar{width:40px;height:40px;border-radius:12px 10px 13px 11px/11px 13px 10px 12px;background:var(--soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.bar{height:9px;border-radius:6px;background:#eef1ee;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:6px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(40,55,50,.42);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:20px;box-shadow:0 20px 50px rgba(40,55,50,.25)}
.modal h3{margin:0 0 14px;font-size:17px;color:var(--ink);font-weight:800;display:flex;align-items:center;gap:8px}
.modal h3>svg{width:18px;height:18px;flex:none;color:var(--pri)}
.aibox{background:#2b3a36;color:#dcebe6;border-radius:14px;padding:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.aibox b{color:#9fe3d4}
.hr{height:1.5px;background:var(--line);margin:12px 0}
.empty{text-align:center;color:var(--sub);padding:24px;font-size:14px}
.blink{font-size:11px;color:var(--bad);font-weight:700}
/* 五维 */
.dimsel{width:auto;min-width:76px;padding:5px 8px;font-size:12px;border-radius:10px}
.dimbars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.dimrow{display:flex;align-items:center;gap:10px}
.dimlab{width:46px;font-size:13px;font-weight:800;flex:none}
.dimnum{width:20px;text-align:right;font-size:13px;font-weight:800;color:var(--sub);flex:none}
/* 项目跟进记录 */
.log{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.log .li{display:flex;gap:8px;font-size:12.5px;align-items:flex-start;line-height:1.5}
.log .li .ld{color:var(--sub);font-weight:700;flex:none;min-width:76px}
/* AI 悬浮按钮 */
.floatai{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--peach),var(--peach2));color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(240,168,120,.45);cursor:pointer;transition:transform .15s}
.floatai:active{transform:scale(.94)}
.floatai svg{width:24px;height:24px}
@media(min-width:761px){.floatai{bottom:28px}}
/* 参考区小节头 */
.ref-sec{font-size:12px;font-weight:800;color:#fff;background:var(--pri);display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px 14px 18px 12px/12px 18px 14px 20px;margin-bottom:14px;letter-spacing:1px}
/* 北极星折叠区块 */
details.refbox{background:#fff;border:1.5px solid var(--line);border-radius:14px 12px 15px 13px/12px 15px 13px 14px;margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
details.refbox>summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:800;color:var(--ink);list-style:none;position:relative;transition:background .15s}
details.refbox>summary::-webkit-details-marker{display:none}
details.refbox>summary::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--pri);transition:transform .2s}
details.refbox[open]>summary::after{transform:translateY(-50%) rotate(180deg)}
details.refbox>summary:hover{background:var(--soft)}
details.refbox .refbody{padding:10px 12px 12px;border-top:1.5px dashed var(--line);font-size:13px}
/* 北极星内部紧凑字号（低频内容） */
.refbody .card{margin-bottom:10px;padding:11px 12px;box-shadow:none;border-radius:12px}
.refbody .card h3{font-size:13.5px;margin-bottom:9px;padding-bottom:8px}
.refbody .card h3>svg{width:16px;height:16px}
.refbody .item{padding:9px 10px;margin-bottom:8px}
.refbody .item .tt{font-size:13px}
.refbody .item .meta{font-size:11.5px}
.refbody .sec{font-size:11.5px;margin:4px 0 7px}
.refbody .fld label{font-size:11px;margin-bottom:3px}
.refbody .fld input,.refbody .fld textarea{font-size:14px;padding:8px 10px}
.refbody .tip{font-size:11.5px;padding:8px 10px;margin-top:7px}
.refbody .muted{font-size:12px}
.refbody .bar{height:7px}
.refbody .row>*{min-width:100px}
.refbody .rw>span{font-size:12.5px}
/* tip 内 svg 兜底（防止大图标撑爆） */
.tip>svg{width:16px;height:16px;flex:none;color:var(--pri);vertical-align:-3px}
/* 顶栏图标按钮 */
.iconbtn{width:38px;height:38px;border-radius:12px 10px 13px 11px/11px 13px 10px 12px;background:#fff;border:1.5px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{background:var(--soft);color:var(--pri);border-color:var(--pri)}
/* 层级串联卡 */
.ladder{background:linear-gradient(180deg,#fff,#f9fdfa);border:1.5px dashed #bfe0d4}
.ladder .lr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1.5px dashed var(--line);font-size:13px}
.ladder .lr:last-child{border-bottom:none}
.ladder .lstep{color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;flex:none;min-width:34px;text-align:center}
.ladder .lbody{flex:1;min-width:0;color:var(--ink);line-height:1.5}
.ladder .lbody .lmute{color:var(--sub);font-size:11px;display:block;margin-top:1px}
/* 周打卡小方格 */
.sqs{display:flex;gap:3px;align-items:center;margin-top:4px}
.sqs .sq{width:13px;height:13px;border-radius:4px;background:#e9efeb;flex:none}
.sqs .sq.on{background:var(--ok);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sqs .sq.today{border:1.5px solid var(--ok);background:#fff}
.sqs .sq.today.on{background:var(--ok);border-color:var(--ok)}
.sqs .sqtxt{font-size:10px;color:var(--sub);font-weight:700;margin-left:2px}
/* 心情 */
.moods{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.mood{font-size:26px;padding:8px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--line);cursor:pointer;transition:all .15s;line-height:1}
.mood.on{background:var(--sun-soft);border-color:var(--sun);transform:scale(1.1)}
.mood:active{transform:scale(.95)}
/* 语音按钮 */
.vbtn{width:40px;height:40px;flex:none;border-radius:12px;background:var(--peach-soft);color:var(--peach);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px dashed var(--peach2)}
.vbtn svg{width:19px;height:19px}
.vbtn.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
/* 云同步状态灯 */
.cloudlamp{display:none;align-items:center;gap:5px;padding:0 10px;height:38px;border-radius:11px;font-size:12px;font-weight:700;background:#fff;border:1.5px solid var(--line);color:var(--sub);cursor:default}
.cloudlamp.show{display:inline-flex}
.cloudlamp .dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.cloudlamp.s-synced .dot{background:#3bb273}
.cloudlamp.s-synced{border-color:#bfe6d2;color:#2c8b5b}
.cloudlamp.s-pushing .dot,.cloudlamp.s-pulling .dot,.cloudlamp.s-pending .dot{background:#f0a93b;animation:pulse 1.2s infinite}
.cloudlamp.s-pushing,.cloudlamp.s-pulling,.cloudlamp.s-pending{border-color:#f3d9a4;color:#a86f12}
.cloudlamp.s-error .dot{background:#e15050}
.cloudlamp.s-error{border-color:#f5c2c2;color:#a82f2f}
/* 进度条 */
.progrow{display:flex;align-items:center;gap:8px;margin-top:5px}
.progrow input[type=range]{flex:1;padding:0;height:6px;accent-color:var(--ok);background:transparent}
.progrow .pnum{font-size:11px;font-weight:800;color:var(--ok);min-width:38px;text-align:right}
/* 归档样式 */
.arc{opacity:.55;background:#f1f5f2 !important;border-style:dashed !important}
.arc .tt{text-decoration:line-through;color:var(--sub)}
/* 接续卡 */
.carry{background:var(--sky-soft);border:1.5px dashed #a9d4e8;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.carry .ct{font-weight:800;font-size:13px;color:var(--sky);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.carry .citem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #cfe6f1;font-size:13px}
.carry .citem:last-child{border-bottom:none}
.carry .citem .ctt{flex:1;min-width:0}
/* 历史归档 */
.histwk{border-left:3px solid var(--pri);padding-left:10px;margin-bottom:12px}
.histwk .hw{font-size:13px;font-weight:800;color:var(--pri);margin-bottom:4px}
.histwk .hm{font-size:12px;color:var(--sub);line-height:1.6}
/* 统计图表 */
.statbox{background:#fff;border:1.5px solid var(--line);border-radius:15px 13px 16px 14px/13px 16px 14px 15px;padding:14px;margin-bottom:12px}

<script>
"use strict";
/* ============== 数据层 ============== */
const KEY="wb_aimios_v1";
const CLOUD_DB_ID="SJ8tomTFeQ9xw1jFavaRQi";
let S=null;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!S.annual) S=seed();
  migrate();
  getDeviceId();
  ghLoadCfg();
  if(hasCloud()) tryPullCloud();              // 资料库通道（workbuddy.link 版）
  else if(ghHas()) ghPull();                  // GitHub Gist 通道（免登录版）
}
function save(){
  S._localUpdated=new Date().toISOString();
  localStorage.setItem(KEY,JSON.stringify(S));
  if(S._dirtyHint)delete S._dirtyHint;
  if(hasCloud()) tryPushCloud();
  else if(ghHas()) ghTryPush();               // 2秒防抖推送
}
let _t; function saveD(){clearTimeout(_t);_t=setTimeout(save,300);}

/* ============== 云同步层（仅在资料库部署时生效） ============== */
let _cloudStatus='off';      // off / pulling / pushing / synced / error / pending
let _cloudMsg='';
let _cloudLastSync='';        // 云端最近更新时间
let _cloudRecordId='';        // 资料库中这条同步记录的 _id
let _pushTimer=null;
let _cloudDeviceId='';
let _pulling=false;           // 拉取中锁
let _pushing=false;           // 推送中锁

function hasCloud(){return !!(typeof window!=='undefined' && window.__SMART_PAGE__ && window.__SMART_PAGE__.database);}
function getDeviceId(){
  if(_cloudDeviceId) return _cloudDeviceId;
  let id='';
  try{id=localStorage.getItem('wb_device_id')||'';}catch(e){}
  if(!id){id=((navigator.platform||'web')+'-'+Math.random().toString(36).slice(2,8)).slice(0,40);}
  try{localStorage.setItem('wb_device_id',id);}catch(e){}
  _cloudDeviceId=id;
  return id;
}

async function tryPullCloud(){
  if(!hasCloud()||_pulling) return;
  _pulling=true;
  _cloudStatus='pulling'; _cloudMsg=''; updateCloudUI();
  try{
    const db=window.__SMART_PAGE__.database;
    const r=await db.query({databaseId:CLOUD_DB_ID,pageSize:1});
    const recs=(r&&r.results)||[];
    if(!recs.length){
      _cloudStatus='synced'; _cloudMsg='云端为空，即将首次推送';
      updateCloudUI();
      await pushCloudNow(true);  // 首次自动推送
      _pulling=false;
      return;
    }
    const rec=recs[0];
    _cloudRecordId=rec._id||'';
    const cloudTs=rec['更新时间']?new Date(rec['更新时间']).getTime():0;
    const localTs=S._localUpdated?new Date(S._localUpdated).getTime():0;
    _cloudLastSync=rec['更新时间']||'';
    if(cloudTs>localTs+1000){   // 云端明显新于本地（>1秒）则覆盖本地
      try{
        const json=JSON.parse(rec['数据内容']||'null');
        if(json && json.annual){
          S=json;
          localStorage.setItem(KEY,JSON.stringify(S));
          _cloudStatus='synced'; _cloudMsg='已从云端拉取最新版本';
          render();
        }else{
          _cloudStatus='error'; _cloudMsg='云端数据格式异常';
        }
      }catch(e){_cloudStatus='error'; _cloudMsg='云端数据解析失败';}
    }else{
      _cloudStatus='synced'; _cloudMsg='本地已是最新';
      await pushCloudNow(true);
    }
  }catch(e){
    _cloudStatus='error'; _cloudMsg='云端连接失败：'+(e&&e.message||String(e));
  }
  _pulling=false;
  updateCloudUI();
}

async function pushCloudNow(silent){
  if(!hasCloud()||_pushing) return false;
  _pushing=true;
  _cloudStatus='pushing'; if(!silent) _cloudMsg=''; updateCloudUI();
  try{
    const db=window.__SMART_PAGE__.database;
    const now=new Date().toISOString();
    const props={
      '数据内容':{text:JSON.stringify(S)},
      '更新时间':{date:now},
      '设备标识':{text:_cloudDeviceId}
    };
    if(_cloudRecordId){
      await db.updateRecord({databaseId:CLOUD_DB_ID,recordId:_cloudRecordId,properties:props});
    }else{
      const r=await db.addRecord({databaseId:CLOUD_DB_ID,properties:props});
      _cloudRecordId=(r&&(r.id||(r.result&&r.result.id)))||'';
      if(!_cloudRecordId){
        // addRecord 成功但没拿到 id，重新拉一次定位
        await tryPullCloud();
      }
    }
    _cloudStatus='synced'; _cloudLastSync=now; _cloudMsg='已同步到云端';
  }catch(e){
    _cloudStatus='error'; _cloudMsg='推送失败：'+(e&&e.message||String(e));
  }
  _pushing=false;
  updateCloudUI();
  return _cloudStatus==='synced';
}

function tryPushCloud(){
  if(!hasCloud()) return;
  _cloudStatus='pending'; updateCloudUI();
  clearTimeout(_pushTimer);
  _pushTimer=setTimeout(()=>{pushCloudNow();},2000);  // 2秒防抖
}

function syncNow(){ if(hasCloud())tryPullCloud(); else if(ghHas())ghPull(true).then(()=>ghPush()); }
function pullFromCloud(){ if(hasCloud())tryPullCloud(); else if(ghHas())ghPull(true); }

/* ============== GitHub Gist 同步通道（免登录版专用） ============== */
let _ghToken='', _ghGistId='';
function ghLoadCfg(){try{_ghToken=localStorage.getItem('wb_gh_token')||'';_ghGistId=localStorage.getItem('wb_gh_gist')||'';}catch(e){}}
function ghHas(){return !!(typeof _ghToken!=='undefined'&&_ghToken);}
async function ghApi(path,opt){
  opt=opt||{};
  const r=await fetch('https://api.github.com'+path,{
    method:opt.method||'GET',
    headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+_ghToken,'X-GitHub-Api-Version':'2022-11-28'},
    body:opt.body?JSON.stringify(opt.body):undefined
  });
  if(!r.ok){let msg='HTTP '+r.status;try{const e=await r.json();if(e&&e.message)msg=e.message;}catch(err){}throw new Error(msg);}
  return r.json();
}
async function ghGetOrCreateGist(){
  if(_ghGistId){
    try{return await ghApi('/gists/'+_ghGistId);}catch(e){_ghGistId='';}
  }
  // 在用户 gist 列表里找同名文件（换设备后恢复连接）
  try{
    const gists=await ghApi('/gists?per_page=100');
    const found=(gists||[]).find(g=>g.files&&g.files['aimi-life.json']);
    if(found){
      _ghGistId=found.id;try{localStorage.setItem('wb_gh_gist',_ghGistId);}catch(e){}
      // 列表接口不含文件内容，重新拉单个 gist 拿 content
      return await ghApi('/gists/'+found.id);
    }
  }catch(e){}
  // 没有则创建一个私有 gist
  const created=await ghApi('/gists',{method:'POST',body:{description:'艾米人生管理系统 自动同步数据（勿删）',public:false,files:{'aimi-life.json':{content:JSON.stringify(S,null,1)}}}});
  _ghGistId=created.id||'';
  try{localStorage.setItem('wb_gh_gist',_ghGistId);}catch(e){}
  return created;
}
async function ghPull(force){
  if(!ghHas()||_pulling) return;
  _pulling=true;
  _cloudStatus='pulling'; _cloudMsg=''; updateCloudUI();
  try{
    const g=await ghGetOrCreateGist();
    const f=g.files&&g.files['aimi-life.json'];
    if(!f){
      _cloudStatus='synced'; _cloudMsg='云端为空，即将首次推送'; updateCloudUI();
      await ghPush(true);
      _pulling=false; return;
    }
    // 注意：GitHub 单 gist API 的文件对象没有 updated_at，时间戳在 gist 顶层
    const cloudTs=g.updated_at?new Date(g.updated_at).getTime():0;
    const localTs=S._localUpdated?new Date(S._localUpdated).getTime():0;
    _cloudLastSync=g.updated_at||'';
    if(force||cloudTs>localTs+1000){
      const json=JSON.parse(f.content);
      if(json&&json.annual){
        S=json; localStorage.setItem(KEY,JSON.stringify(S));
        _cloudStatus='synced'; _cloudMsg=(force?'已强制拉取云端版本':'已从云端拉取最新版本'); render();
      }else{_cloudStatus='error'; _cloudMsg='云端数据格式异常';}
    }else{
      _cloudStatus='synced'; _cloudMsg='本地已是最新';
      await ghPush(true);
    }
  }catch(e){
    _cloudStatus='error'; _cloudMsg='同步失败：'+(e&&e.message||String(e));
  }
  _pulling=false; updateCloudUI();
}
async function ghPush(silent){
  if(!ghHas()||_pushing) return false;
  _pushing=true;
  _cloudStatus='pushing'; if(!silent) _cloudMsg=''; updateCloudUI();
  try{
    await ghGetOrCreateGist();
    const now=new Date().toISOString();
    await ghApi('/gists/'+_ghGistId,{method:'PATCH',body:{files:{'aimi-life.json':{content:JSON.stringify(S,null,1)}}}});
    _cloudStatus='synced'; _cloudLastSync=now; _cloudMsg='已同步到云端(GitHub)';
  }catch(e){
    _cloudStatus='error'; _cloudMsg='推送失败：'+(e&&e.message||String(e));
  }
  _pushing=false; updateCloudUI();
  return _cloudStatus==='synced';
}
function ghTryPush(){
  if(!ghHas()) return;
  _cloudStatus='pending'; updateCloudUI();
  clearTimeout(_pushTimer);
  _pushTimer=setTimeout(()=>{ghPush();},2000);
}
function ghSaveCfg(){
  const el=document.getElementById('ghTokenIn');
  if(!el) return;
  const t=el.value.trim();
  _ghToken=t;
  try{localStorage.setItem('wb_gh_token',t);}catch(e){}
  if(t) ghPull(true); else _cloudStatus='off';
  updateCloudUI(); refreshCloudPanel();
}
function ghClearCfg(){
  _ghToken=''; _ghGistId='';
  try{localStorage.removeItem('wb_gh_token');localStorage.removeItem('wb_gh_gist');}catch(e){}
  _cloudStatus='off'; _cloudMsg=''; _cloudLastSync='';
  updateCloudUI(); refreshCloudPanel();
}

/* 同步状态灯 + 设置弹窗里的状态卡片刷新 */
function updateCloudUI(){
  const lamp=document.getElementById('cloudLamp');
  if(!lamp) return;
  if(!hasCloud()&&!ghHas()){lamp.className='cloudlamp';lamp.innerHTML='';lamp.title='当前为本地模式（未启用云同步）';return;}
  const label={
    off:'未连接',pulling:'拉取中…',pushing:'推送中…',
    pending:'待同步',synced:'已同步',error:'同步失败'
  }[_cloudStatus]||_cloudStatus;
  const last=_cloudLastSync?(' · '+relTime(_cloudLastSync)):'';
  lamp.className='cloudlamp show s-'+_cloudStatus;
  lamp.innerHTML='<span class="dot"></span><span>云·'+label+last+'</span>';
  lamp.title=(_cloudMsg||label)+( _cloudDeviceId?('\n设备：'+_cloudDeviceId):'' );
}
function relTime(iso){
  try{
    const d=new Date(iso);
    const sec=Math.round((Date.now()-d.getTime())/1000);
    if(sec<60) return sec+'秒前';
    if(sec<3600) return Math.round(sec/60)+'分钟前';
    if(sec<86400) return Math.round(sec/3600)+'小时前';
    return Math.round(sec/86400)+'天前';
  }catch(e){return '';}
}
function getP(o,p){return p.split('.').reduce((a,c)=> (a==null?a:a[c]),o);}
function setP(o,p,v){const ks=p.split('.');let o2=o;for(let i=0;i<ks.length-1;i++){if(o2[ks[i]]==null)o2[ks[i]]= /^\d+$/.test(ks[i+1])?[]:{};o2=o2[ks[i]];}o2[ks[ks.length-1]]=v;}
function setVal(p,v){setP(S,p,v);saveD();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============== 日期工具 ============== */
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dstr(new Date());}
function yest(){const d=new Date();d.setDate(d.getDate()-1);return dstr(d);}
function parseD(s){ if(s instanceof Date) return s; const p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function wkKey(d){d=d?parseD(d):new Date();const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(t.getDay()+6)%7;const mon=t;mon.setDate(t.getDate()-day);const w=new Date(mon);w.setDate(mon.getDate()+3);const wk=1+Math.round(((w-mon)/86400000+ (mon.getDay()==4?-4:0))/7);let yr=w.getFullYear();return yr+'-W'+String(getWeek(d)).padStart(2,'0');}
function getWeek(d){d=d?parseD(d):new Date();const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(t.getDay()+6)%7;t.setDate(t.getDate()-day+3);const first=new Date(t.getFullYear(),0,4);const week=1+Math.round(((t-first)/86400000)/7);return week;}
function monthKey(d){d=d?parseD(d):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

      D.items=D.top3.map(x=>({text:x.text||'',done:!!x.done,fromWeek:!!x.fromWeek,dim:x.dim||'exec',time:'',progress:x.done?100:0,status:'',subtasks:[],archived:!!x.done}));

    }
    if(!Array.isArray(D.items))D.items=[];
  });
}

function getTodayItems(){
  const t=today(); const items=[];
  // 今日 + 历史未完成事项（自动顺延，全部完成后归档）
  Object.keys(S.daily).filter(d=>d<=t).sort().forEach(d=>{
    (S.daily[d].items||[]).forEach(x=>{
      if(x.done)return;
      items.push(d===t
        ?{tag:'today',tagtxt:'今日',text:x.text,act:'go(\'today\')'}
        :{tag:'over',tagtxt:'逾期',text:x.text+'（'+d+'）',act:'go(\'today\')'});
    });
  });
  // 项目逾期/今日到期
  S.projects.filter(p=>p.status===0&&p.due&&p.due<=t).forEach(p=>{
    items.push({tag:(p.due<t?'over':'soon'),tagtxt:(p.due<t?'逾期':'今天'),text:'项目：'+p.name,act:'go(\'proj\')'});
  });
  return items.slice(0,8);
}

/* 周打卡小方格：本周 7 天，绿色=已打卡 */
function habitSquares(hid){
  const days=weekDayStrs();const t=today();
  let cnt=0;
  const sqs=days.map(d=>{
    const on=S.daily[d]&&S.daily[d].habitDone&&S.daily[d].habitDone[hid];
    if(on)cnt++;
    return '<span class="sq '+(on?'on':'')+(d===t?' today':'')+'"></span>';
  }).join('');
  return '<div class="sqs">'+sqs+'<span class="sqtxt">本周 '+cnt+'/'+days.length+' 天</span></div>';
}
/* 语音录入心情日记 */
function voiceDiary(t){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('当前浏览器不支持语音，请用 Chrome 或 Edge 打开');return;}
  const btn=document.getElementById('voiceBtn');
  const rec=new SR();
  rec.lang='zh-CN';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=function(){if(btn)btn.classList.add('rec');};
  rec.onend=function(){if(btn)btn.classList.remove('rec');};
  rec.onerror=function(e){if(btn)btn.classList.remove('rec');alert('语音识别失败：'+e.error);};
  rec.onresult=function(e){
    const txt=e.results[0][0].transcript;
    const D=S.daily[t]||(S.daily[t]={energy:8,time:'',items:[],blocks:[],habitDone:{},close:{},inbox:[]});
    D.diary=(D.diary||'')+(D.diary?'':'')+txt;
    save();render();
  };
  try{rec.start();}catch(e){alert('请允许麦克风权限后重试');}
}

}

      '</div><div class="ops"><button class="btn soft sm" onclick="editProj('+idx+')">'+icon('edit')+'</button><button class="btn danger sm" onclick="delProj('+idx+')">'+icon('trash')+'</button></div></div>';
    });

}

/* ============== 月度仪表盘 ============== */
function prevMonthKey(mk){const p=mk.split('-');let y=+p[0],m=+p[1]-1;if(m===0){y--;m=12;}return y+'-'+String(m).padStart(2,'0');}
function monthLabel(mk){const p=mk.split('-');return +p[0]+'年'+ +p[1]+'月';}
function vMonth(){
  const mk=monthKey(); if(!S.monthly[mk])S.monthly[mk]={theme:'',milestones:[],data:[],fixed:[],notDo:[],review:{},habitFb:''};
  const M=S.monthly[mk];
  // 上月未完成 → 本月接续
  const pmk=prevMonthKey(mk);const PM=S.monthly[pmk];
  const carry=PM?(PM.milestones||[]).filter(m=>!m.ok&&!m.drop):[];
  let carryHtml='';
  if(carry.length){
    carryHtml='<div class="carry"><div class="ct">'+icon('month')+' 上月未完成 · 是否继续？</div>'+
      carry.map((m,i)=>{
        const idx=(PM.milestones||[]).indexOf(m);
        return '<div class="citem"><span class="ctt">'+esc(m.t)+' <span class="chip gray">进度 '+(m.prog||0)+'%</span></span>'+
          '<button class="btn gold sm" onclick="carryMs('+idx+')">继续</button>'+
          '<button class="btn gray sm" onclick="dropMs('+idx+')">放弃</button></div>';
      }).join('')+'</div>';
  }
  // 里程碑：进度条，完成(≥100%)→归档
  let ms=M.milestones.map((m,i)=>{
    const prog=m.prog||0;const done=prog>=100;

    return '<div class="item'+cls+'"><div class="body">'+
      '<div class="rw" style="margin-bottom:5px"><input value="'+esc(m.t||'')+'" placeholder="里程碑内容（必填）" oninput="setP(S,\'monthly.'+mk+'.milestones.'+i+'.t\',this.value);saveD()" style="font-weight:700;flex:1;min-width:0">'+
      '<input value="'+esc(m.p||'')+'" placeholder="优先级" oninput="setP(S,\'monthly.'+mk+'.milestones.'+i+'.p\',this.value);saveD()" style="flex:0 0 92px;min-width:78px;padding:8px 9px;font-size:12.5px"></div>'+
      (done?'<div class="meta"><span class="chip ok">已归档（进度≥100%）</span></div>':'')+
      '<div class="rw" style="margin:3px 0"><input value="'+esc(m.done||'')+'" placeholder="完成标准（怎样算完成）" oninput="setP(S,\'monthly.'+mk+'.milestones.'+i+'.done\',this.value);saveD()" style="flex:1;min-width:0;font-size:13px;padding:7px 9px">'+
      '<input type="date" value="'+esc(m.due||'')+'" onchange="setP(S,\'monthly.'+mk+'.milestones.'+i+'.due\',this.value);save();render()" style="flex:0 0 150px;min-width:130px;padding:7px 8px;font-size:12.5px"></div>'+
      '<div class="progrow"><input type="range" min="0" max="100" step="5" value="'+prog+'" oninput="setP(S,\'monthly.'+mk+'.milestones.'+i+'.prog\',+this.value);saveD()" onchange="render()"><span class="pnum">'+prog+'%</span></div>'+
    '</div><div class="ops"><button class="btn danger sm" onclick="delMs(\''+mk+'\','+i+')">'+icon('trash')+'</button></div></div>';
  }).join('');
  const full=M.milestones.length>=5?'<div class="blink">里程碑已达 5 个上限</div>':'';
  const notDo=M.notDo.map((x,i)=>'<div class="rw" style="margin:4px 0"><input value="'+esc(x)+'" oninput="setP(S,\'monthly.'+mk+'.notDo.'+i+'\',this.value);saveD()"><button class="btn danger sm" onclick="delArr(\'monthly.'+mk+'.notDo\','+i+')">'+icon('x')+'</button></div>').join('');
  // 本月习惯汇总
  const days=monthDayStrs();
  const habitSum=S.habits.map(h=>{let n=0;days.forEach(d=>{if(S.daily[d]&&S.daily[d].habitDone&&S.daily[d].habitDone[h.id])n++;});return {name:h.name,n};}).filter(h=>h.n>0);
  const habitSumHtml=habitSum.length?habitSum.map(h=>'<div class="rw" style="margin:3px 0;font-size:13px"><span style="flex:1">'+esc(h.name)+'</span><span class="muted" style="min-width:80px;text-align:right">'+h.n+'/'+days.length+'天</span></div>').join(''):'<div class="muted">本月暂无打卡记录</div>';
  return carryHtml+
  '<div class="card"><h3>'+icon('month')+' 月度仪表盘 <span class="sub">'+monthLabel(mk)+'</span></h3>'+
    fieldArea('monthly.'+mk+'.theme','本月主题（一句话）',M.theme,'这个月最重要的变化是什么？')+
    '<div class="sec">本月核心里程碑（5 个，拉进度条≥100%即归档） <span class="sub">'+cap('容量',M.milestones.length>=5,M.milestones.length,5)+'</span></div>'+ms+full+
      (M.milestones.length<5?'<button class="btn gold sm" onclick="addMs(\''+mk+'\')">'+icon('plus')+' 增加里程碑</button>':'')+
    '<div class="sec">本月习惯打卡汇总</div>'+habitSumHtml+
      fieldArea('monthly.'+mk+'.habitFb','本月习惯总结与反馈',M.habitFb||'','哪些习惯养成了？哪些要调整？下月怎么改？')+
    '<div class="sec">本月不做清单（≥3）</div>'+notDo+'<button class="btn soft sm" onclick="addArr(\'monthly.'+mk+'.notDo\',\'不启动新方向\')">'+icon('plus')+' 增加</button>'+
    '<div class="sec">固定事件</div>'+fieldArea('monthly.'+mk+'.fixed','已确定不可移动的事项',(Array.isArray(M.fixed)?M.fixed:[]).join('\n'),'每行一条')+
    '<div class="sec">月度复盘（6 问）</div>'+fieldArea('monthly.'+mk+'.review.q','本月最重要的结果 / 里程碑状态 / 数据反映 / 最大阻碍 / 项目去留 / 下月变化',typeof M.review==='string'?M.review:(M.review.q||''),'')+
    '<div class="row" style="margin-top:10px"><button class="btn gold sm" onclick="aiMonth()">'+icon('ai')+' AI 月复盘草稿</button></div>'+
  '</div>'+
  '<div class="card"><h3>'+icon('target')+' 本月五维行动分布</h3>'+dimBars(dimCountDays(monthDayStrs()))+
    '<div class="tip">本月各维度完成动作数。月底复盘时看：哪一维最弱？下月补一条对应习惯。</div></div>'+
  '<div class="tip">月度只决定「这个月拿到什么结果」。完成的项目归档，未完成的下月问自己「继续还是放弃」。</div>';
}
function carryMs(i){
  const pmk=prevMonthKey(monthKey()),mk=monthKey();
  const m=S.monthly[pmk].milestones[i];if(!m)return;
  const M=S.monthly[mk];if(M.milestones.length>=5){alert('本月已达 5 个上限，先完成一个');return;}
  M.milestones.push({t:m.t,p:m.p,done:m.done,due:m.due,prog:m.prog||0});
  m.drop=true;save();render();
}
function dropMs(i){const pmk=prevMonthKey(monthKey());S.monthly[pmk].milestones[i].drop=true;save();render();}
function addMs(mk){const M=S.monthly[mk];if(M.milestones.length>=5){alert('已达5个上限');return;}M.milestones.push({t:'',p:'',done:'',due:'',prog:0});save();render();}
function delMs(mk,i){S.monthly[mk].milestones.splice(i,1);save();render();}

/* ============== 周计划 ============== */
/* 周日期区间 如 2026-W32 (08-03~08-09) */
function weekRange(){
  const ds=weekDayStrs();
  return ' ('+ds[0].slice(5)+'~'+ds[6].slice(5)+')';
}
function prevWeekKey(){const d=new Date();const day=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-day-7);return wkKey(mon);}
function vWeek(){
  const wk=wkKey(); if(!S.weekly[wk])S.weekly[wk]={theme:'',results:[],projectPush:[],fixed:[],habits:[],review:{}};
  const W=S.weekly[wk];
  const range=weekRange();
  // 上周未完成 → 本周接续
  const pwk=prevWeekKey();const PW=S.weekly[pwk];
  const carry=PW?(PW.results||[]).filter(r=>!r.ok&&!r.drop):[];
  let carryHtml='';
  if(carry.length){
    carryHtml='<div class="carry"><div class="ct">'+icon('week')+' 上周未完成 · 是否继续？</div>'+
      carry.map((r,i)=>{
        const idx=(PW.results||[]).indexOf(r);
        return '<div class="citem"><span class="ctt">'+esc(r.t)+' <span class="chip gray">进度 '+(r.prog||0)+'%</span></span>'+
          '<button class="btn gold sm" onclick="carryWk('+idx+')">继续</button>'+
          '<button class="btn gray sm" onclick="dropWk('+idx+')">放弃</button></div>';
      }).join('')+'</div>';
  }
  // 本周成果：带进度条，完成→灰化归档
  let rs=W.results.map((r,i)=>{
    const annualOpts=[[-1,'未关联']].concat(S.annual.results.map((a,j)=>[j,'年度'+(j+1)+'：'+((a.t||'').slice(0,14))]));
    const prog=r.prog||0;
    const doneCls=r.ok?' arc':'';
    return '<div class="item'+doneCls+'"><div class="body"><div class="tt">关键成果 '+(i+1)+' '+(r.ok?'<span class="chip ok">已归档</span>':'')+'</div>'+
      '<div class="rw" style="margin-top:4px"><input value="'+esc(r.t)+'" oninput="setP(S,\'weekly.'+wk+'.results.'+i+'.t\',this.value);saveD()">'+
      '<label style="display:flex;align-items:center;gap:4px;min-width:70px;font-size:13px"><input type="checkbox" '+(r.ok?'checked':'')+' onchange="setP(S,\'weekly.'+wk+'.results.'+i+'.ok\',this.checked);save()"> 完成归档</label></div>'+
      '<div class="progrow"><input type="range" min="0" max="100" step="5" value="'+prog+'" onchange="setP(S,\'weekly.'+wk+'.results.'+i+'.prog\',+this.value);save();render()"><span class="pnum">'+prog+'%</span></div>'+
      '<div class="rw" style="margin-top:4px"><label style="font-size:12px;color:var(--sub)">关联年度 →</label><select onchange="setP(S,\'weekly.'+wk+'.results.'+i+'.linked\',+this.value);save()" style="min-width:auto">'+
        annualOpts.map(([v,l])=>'<option value="'+v+'"'+(r.linked===v||(r.linked==null&&v===-1)?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
    '</div><div class="ops"><button class="btn danger sm" onclick="delWk(\''+wk+'\','+i+')">'+icon('trash')+'</button></div></div>';
  }).join('');
  const full=W.results.length>=3?'<div class="blink">关键成果已达 3 个上限，先完成再调整</div>':'';
  // 本周习惯汇总
  const habitSum=habitsWeekSum();
  const habitSumHtml=habitSum.length?habitSum.map(h=>'<div class="rw" style="margin:3px 0;font-size:13px"><span style="flex:1">'+esc(h.name)+'</span><div class="bar" style="max-width:160px"><i style="width:'+(h.n/7*100)+'%"></i></div><span class="muted" style="min-width:44px;text-align:right">'+h.n+'/7天</span></div>').join(''):'<div class="muted">暂无习惯</div>';
  const agendaHtml=getAgenda(wk).map((a,i)=>agendaCard(wk,i,a)).join('');
  return carryHtml+
  '<div class="card"><h3>'+icon('week')+' 周计划与复盘 <span class="sub">'+wk+range+'</span></h3>'+
    fieldArea('weekly.'+wk+'.theme','本周主题（一句话）',W.theme,'')+
    '<div class="sec">本周关键成果（3 个） <span class="sub">'+cap('容量',W.results.length>=3,W.results.length,3)+'</span></div>'+rs+full+
      (W.results.length<3?'<button class="btn gold sm" onclick="addWk(\''+wk+'\')">'+icon('plus')+' 增加成果</button>':'')+
    '<div class="sec">周日程备忘（日期 · 内容 · 可折叠细分待办） <span class="sub">'+getAgenda(wk).length+' 条</span></div>'+
      (getAgenda(wk).length?'':'<div class="empty">还没有周日程，点下方「添加日程备忘」，可填日期、主要内容，再展开加细分待办。</div>')+
      agendaHtml+
      '<button class="btn gold sm" onclick="addAgenda(\''+wk+'\')">'+icon('plus')+' 添加日程备忘</button>'+
    '<div class="sec">本周习惯打卡汇总</div>'+habitSumHtml+
      fieldArea('weekly.'+wk+'.habitFb','本周习惯反馈（哪些坚持得好/哪些要调）',W.habitFb||'','')+
    '<div class="sec">项目推进</div>'+fieldArea('weekly.'+wk+'.projectPush','各活跃项目本周结果/下一步',(Array.isArray(W.projectPush)?W.projectPush:[]).join('\n'),'每行一个项目')+
    '<div class="sec">固定日程与机动（保留 20%）</div>'+fieldArea('weekly.'+wk+'.fixed','已确定的固定日程',(Array.isArray(W.fixed)?W.fixed:[]).join('\n'),'每行一条')+
    '<div class="sec">周复盘（事实→原因→决定）</div>'+fieldArea('weekly.'+wk+'.review.note','复盘摘要',typeof W.review==='string'?W.review:(W.review.note||''),'')+
    '<div class="row" style="margin-top:10px"><button class="btn gold sm" onclick="aiWeek()">'+icon('ai')+' AI 周复盘草稿</button></div>'+
  '</div>'+
  '<div class="card"><h3>'+icon('target')+' 本周五维行动分布</h3>'+dimBars(dimCountDays(weekDayStrs()))+
    '<div class="tip">本周你在 5 个改进维度的完成动作数（来自每日计划勾选）。某维度连续 2 周为 0，下周在今日计划里补一条。</div></div>'+
  '<div class="tip">周计划是执行中枢：只选 3 个关键成果，完成即归档；没完成的在下周问自己「继续还是放弃」。</div>';
}
/* 本周习惯打卡汇总：每个习惯本周打卡天数 */
function habitsWeekSum(){
  const days=weekDayStrs();
  return S.habits.map(h=>{
    let n=0;days.forEach(d=>{if(S.daily[d]&&S.daily[d].habitDone&&S.daily[d].habitDone[h.id])n++;});
    return {name:h.name,n};
  });
}
function carryWk(i){
  const pwk=prevWeekKey(),wk=wkKey();
  const r=S.weekly[pwk].results[i];if(!r)return;
  const W=S.weekly[wk];if(W.results.length>=3){alert('本周已达 3 个上限，先完成一个');return;}
  W.results.push({t:r.t,ok:false,linked:r.linked,prog:r.prog||0});
  r.drop=true;save();render();
}
function dropWk(i){const pwk=prevWeekKey();S.weekly[pwk].results[i].drop=true;save();render();}
function addWk(wk){const W=S.weekly[wk];if(W.results.length>=3){alert('已达3个上限');return;}W.results.push({t:'',ok:false,prog:0});save();render();}
function delWk(wk,i){S.weekly[wk].results.splice(i,1);save();render();}
/* ===== 周日程备忘：日期 + 主要内容 + 可折叠细分待办（参考 iPhone 日程备忘） ===== */
function getAgenda(wk){const W=S.weekly[wk];if(!W.agenda)W.agenda=[];return W.agenda;}
function addAgenda(wk){const A=getAgenda(wk);A.push({id:uid(),date:today(),text:'',subtasks:[],done:false,fold:false});save();render();}
function delAgenda(wk,i){getAgenda(wk).splice(i,1);save();render();}
function toggleAgendaItem(wk,i){const a=getAgenda(wk)[i];if(!a)return;a.done=!a.done;save();render();}
function toggleAgendaFold(wk,i){const a=getAgenda(wk)[i];if(!a)return;a.fold=!a.fold;save();render();}
function addAgendaSub(wk,i){const a=getAgenda(wk)[i];if(!a)return;if(!a.subtasks)a.subtasks=[];a.subtasks.push({text:'',done:false});save();render();}
function addAgendaSubInline(wk,i,el){const v=el?el.value.trim():'';if(!v){if(el)el.focus();return;}const a=getAgenda(wk)[i];if(!a)return;if(!a.subtasks)a.subtasks=[];a.subtasks.push({text:v,done:false});save();render();}
function toggleAgendaSub(wk,i,j){const a=getAgenda(wk)[i];if(!a||!a.subtasks||!a.subtasks[j])return;a.subtasks[j].done=!a.subtasks[j].done;syncAgenda(wk,i);save();render();}
function delAgendaSub(wk,i,j){const a=getAgenda(wk)[i];if(!a)return;a.subtasks.splice(j,1);syncAgenda(wk,i);save();render();}
function syncAgenda(wk,i){const a=getAgenda(wk)[i];if(!a||!a.subtasks||!a.subtasks.length)return;const all=a.subtasks.every(s=>s.done);if(all){a.done=true;}else if(a.done && (a.subtasks||[]).length){a.done=false;}}
function agendaCard(wk,i,a){
  const subs=a.subtasks||[];
  const subHtml=subs.map((s,j)=>
    '<div class="rw" style="margin:3px 0 3px 6px">'+
    '<label style="display:flex;align-items:flex-start;gap:6px;font-size:13px;flex:1;min-width:0">'+
    '<input type="checkbox" '+(s.done?'checked':'')+' onchange="toggleAgendaSub(\''+wk+'\','+i+','+j+')" style="margin-top:10px">'+
    '<textarea class="mini auto" style="min-height:34px;font-size:13px" placeholder="细分内容" oninput="autoH(this);setP(S,\'weekly.'+wk+'.agenda.'+i+'.subtasks.'+j+'.text\',this.value);saveD()">'+esc(s.text)+'</textarea></label>'+
    '<button class="btn danger sm" onclick="delAgendaSub(\''+wk+'\','+i+','+j+')">'+icon('x')+'</button></div>'
  ).join('');
  const subDone=subs.filter(s=>s.done).length;
  const showSubs=!a.fold;
  return '<div class="item'+(a.done?' arc':'')+'"><div class="body">'+
    '<div class="rw" style="margin-bottom:4px">'+
      '<input type="date" value="'+esc(a.date||'')+'" onchange="setP(S,\'weekly.'+wk+'.agenda.'+i+'.date\',this.value);save();render()" style="flex:0 0 138px;min-width:120px;padding:7px 8px;font-size:12.5px">'+
      '<label style="display:flex;align-items:center;flex:none;padding-right:2px"><input type="checkbox" '+(a.done?'checked':'')+' onchange="toggleAgendaItem(\''+wk+'\','+i+')" title="标记完成"></label>'+
      '<textarea class="mini auto" style="font-weight:700;flex:1;min-width:0;min-height:38px" placeholder="主要内容" oninput="autoH(this);setP(S,\'weekly.'+wk+'.agenda.'+i+'.text\',this.value);saveD()">'+esc(a.text||'')+'</textarea>'+
    '</div>'+
    '<div class="ops" style="margin:2px 0 4px">'+
      '<button class="btn soft sm" onclick="toggleAgendaFold(\''+wk+'\','+i+')">'+icon('down')+' '+(showSubs?'收起细分':'展开细分')+(subs.length?(' '+subDone+'/'+subs.length):'')+'</button>'+
      (subs.length?'<span class="chip gray">细分 '+subDone+'/'+subs.length+'</span>':'')+
      '<button class="btn danger sm" onclick="delAgenda(\''+wk+'\','+i+')">'+icon('trash')+'</button>'+
    '</div>'+
    (showSubs?('<div class="rw" style="margin:2px 0">'+
      '<input id="agSubIn-'+wk+'-'+i+'" placeholder="添加细分内容，回车确认" onkeydown="if(event.key===\'Enter\')addAgendaSubInline(\''+wk+'\','+i+',this)" style="flex:1;min-width:0;font-size:13px;padding:7px 9px">'+
      '<button class="btn soft sm" style="flex:none" onclick="addAgendaSubInline(\''+wk+'\','+i+',document.getElementById(\'agSubIn-'+wk+'-'+i+'\'))">'+icon('plus')+' 添加</button>'+
    '</div>'+subHtml):'')+
    '</div></div>';
}

function vAI(){
  const roles=[['规划','将目标拆项目、项目拆行动、检查容量'],['复盘','区分事实感受、识别模式、提调整'],['知识','提炼资料、生成知识卡'],['内容','从经验提取选题、整理结构'],['决策','列选择、析利弊、查价值观']];

    '<div class="aibox" id="aictx">'+esc(ctx)+'</div>'+
    '<div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="copyCtx()">复制上下文</button>'+
    '<button class="btn gold sm" onclick="aiWeek()">生成本周复盘草稿</button>'+
    '<button class="btn gold sm" onclick="aiMonth()">生成本月复盘草稿</button></div>'+
    '<div class="sec" style="margin-top:12px">脱敏说明</div>'+
    '<div class="tip">不提交客户姓名/证件/保单/银行卡/病历。需要分析时用「客户A/客户B」代替，金额用区间。AI 不替你增加目标、不诊断身心问题。</div>'+

  '</div>';
}
function buildCtx(){
  const A=S.annual,W=S.weekly[wkKey()];
  const L=[];
  L.push('【长期方向】');
  L.push('愿景：'+S.lifeGuide.vision);
  L.push('核心价值观：'+S.lifeGuide.principles.map(p=>p.t).join('、'));
  L.push('八大领域：'+S.lifeGuide.domains.map(d=>d.n).join('、'));
  L.push('');
  L.push('【年度重点】');
  L.push('主题：'+A.theme);
  L.push('三关键词：'+A.keywords.join('/'));
  L.push('核心结果：');
  L.push(A.results.map((r,i)=>'  '+(i+1)+'. '+r.t+'（指标：'+r.m+'）').join('\n'));
  L.push('年度不做：'+A.notDo);
  L.push('');
  L.push('【当前阶段】');
  L.push('本月：'+(S.monthly[monthKey()]?S.monthly[monthKey()].theme:''));
  L.push('本周：'+(W?W.theme:''));
  L.push('本周关键成果：');
  L.push(W?W.results.map((r,i)=>'  '+(i+1)+'. '+r.t+(r.ok?'（已完成）':'')+(r.linked!=null&&r.linked>=0?' [←年度'+(r.linked+1)+']':'')).join('\n'):'（未填）');
  L.push('活跃项目：');
  L.push(S.projects.filter(p=>p.status===0).map(p=>'  - '+p.name+'（下一步：'+p.next+'）').join('\n'));
  L.push('核心习惯：'+S.habits.filter(h=>h.cat==='core').map(h=>h.name).join('、'));
  L.push('');
  L.push('【现实约束】');
  L.push('每周可支配时间：待填 ｜ 家庭责任：丈夫+2子+父母 ｜ 风险边界：不提交敏感信息');
  L.push('');
  L.push('【最近反馈】');
  L.push(S.events.slice(0,3).map(e=>'  - '+e.what+'：'+(e.deposit||'')).join('\n'));
  L.push('');
  L.push('【AI偏好】');
  L.push(S.aiCtx.overrides);
  return L.join('\n');
}
function aiRole(r){const c=buildCtx();const map={规划:'请基于以上上下文，帮我把当前活跃项目拆成下一步行动，并检查计划是否超载（周3/日3）。',复盘:'请基于以上上下文，对本周关键成果做事实-原因-决定分析，未完成项只标一个主因。',知识:'请基于以上，把最近一条复盘沉淀提炼为一条可复用的原则或清单。',内容:'请基于我的身份与经验，从当前项目/复盘中提取 3 个内容选题。',决策:'请列出我面临的一个选择，分析利弊、对照价值观与风险边界。'};
  openModal('<h3>AI · '+r+'</h3><div class="aibox">'+esc('【上下文已就绪，粘贴给 AI 即可】\n\n'+c+'\n\n【本次任务】\n'+map[r])+'</div><div class="row"><button class="btn ghost" onclick="copyModal()">复制全部</button><button class="btn" onclick="closeModal()">关闭</button></div>');}

/* AI 生成今日复盘日记（聚合 top3/心情/打卡/4 问） */
function aiDay(){
  const t=today();
  if(!S.daily[t])S.daily[t]={energy:8,time:'',items:[],blocks:[],habitDone:{},close:{},inbox:[],mood:'',diary:''};
  const D=S.daily[t];
  const tops=D.items||[];
  const done=tops.filter(x=>x.done);
  const undone=tops.filter(x=>!x.done);
  const habitDone=S.habits.filter(h=>D.habitDone[h.id]);
  const habitNot=S.habits.filter(h=>!D.habitDone[h.id]);
  const c=D.close||{};
  const moodTxt={'😄':'很棒','🙂':'平稳','😐':'一般','😔':'低落','😣':'焦虑','😴':'疲惫'};
  const mood=moodTxt[D.mood]||'平稳';
  const topDoneTxt=done.length?done.map((x,i)=>'  '+(i+1)+'. ✅ '+x.text).join('\n'):'  （无）';
  const topUndoneTxt=undone.length?undone.map((x,i)=>'  '+(i+1)+'. ⬜ '+x.text).join('\n'):'  （无）';
  const habitTxt=habitDone.length?habitDone.map(h=>'  ✓ '+h.name).join('\n'):'  （无）';
  const txt='【今日复盘日记】 '+t+'\n\n'+
    '☀ 心情：'+D.mood+' '+mood+'\n'+
    '⚡ 精力：'+(D.energy||'?')+'/10 ｜ 可支配时间：'+(D.time||'—')+'\n\n'+
    '✓ 完成的事：\n'+topDoneTxt+'\n\n'+
    '⬜ 未完成：\n'+topUndoneTxt+'\n\n'+
    '🔁 习惯打卡：\n'+habitTxt+'\n'+
    (habitNot.length?'  ✗ 未打卡：'+habitNot.length+' 个\n':'')+
    '\n📝 4 问自省：\n'+
    '  ① 进展：'+(c.q1||'—')+'\n'+
    '  ② 没完成：'+(c.q2||'—')+'\n'+
    '  ③ 原因：'+(c.q3||'—')+'\n'+
    '  ④ 明天第一步：'+(c.q4||'—')+'\n\n'+
    '🌿 自由感想：'+(D.diary||'今天还没写下心情日记…');
  openModal('<h3>'+icon('day')+' 今日复盘日记草稿</h3><div class="aibox">'+esc(txt)+'</div>'+

/* 历史某周的日期区间（从 key 推不出则回退本周算法） */
function weekRangeOf(k){
  // k 形如 2026-W32，还原周一日期
  try{
    const parts=k.split('-W');const yr=+parts[0];const wk=+parts[1];
    const jan4=new Date(yr,0,4);
    const day=(jan4.getDay()+6)%7;
    const mon=new Date(yr,0,4-day+3);
    const monday=new Date(mon);monday.setDate(mon.getDate()+(wk-1)*7);
    const sun=new Date(monday);sun.setDate(monday.getDate()+6);
    const f=d=>String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return ' ('+f(monday)+'~'+f(sun)+')';
  }catch(e){return '';}
}

function statDailyDoneRate(days){

}
function statHabitRate(days){
  const arr=[];const H=S.habits.length;if(!H)return arr;
  for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dstr(d);const D=S.daily[k];const done=D&&D.habitDone?Object.values(D.habitDone).filter(v=>v).length:0;arr.push({date:k,done,total:H,pct:Math.round(done/H*100)});}
  return arr;
}
function statProjStatus(){const c=[0,0,0,0];S.projects.forEach(p=>{if(c[p.status]!=null)c[p.status]++;});return c;}
function statHeat5(days){
  const grid={};DIMS.forEach(d=>grid[d[0]]=[]);
  for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dstr(d);const D=S.daily[k];
    DIMS.forEach(([r,nm,col])=>{let n=0;if(D&&D.items)D.items.forEach(x=>{if(x.dim===r&&x.done)n++;});grid[r].push({n,col});});}

}

/* 通用折线图 SVG */
function svgLine(series,w,h,max,color){
  if(!series.length)return '';
  const maxV=max||Math.max(1,...series.map(s=>s.v));
  const step=w/(series.length-1||1);
  const pts=series.map((s,i)=>[i*step, h-10-(s.v/maxV)*(h-20)]).map(p=>p.join(',')).join(' ');
  return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
}
function svgDots(series,w,h,max,color){
  if(!series.length)return '';
  const maxV=max||Math.max(1,...series.map(s=>s.v));
  const step=w/(series.length-1||1);
  return series.map((s,i)=>'<circle cx="'+(i*step)+'" cy="'+(h-10-(s.v/maxV)*(h-20))+'" r="2.8" fill="'+color+'"/>').join('');
}
/* 八大领域雷达图 SVG */
function svgRadar8(values,size){
  size=size||240;
  const cx=size/2,cy=size/2,r=size*0.36,N=8;
  const labels=['健康','家庭','事业','副业','学习','财务','社交','生活'];
  let grid='',poly='';
  for(let lvl=1;lvl<=5;lvl++){
    const rr=r*lvl/5;const pts=[];
    for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;pts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}
    grid+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="#e2e7e2" stroke-width="1"/>';
  }
  const data=values.map(v=>v.s);
  const dataPts=data.map((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/N;const rr=r*v/10;return (cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a));}).join(' ');
  let axes='',texts='';
  for(let i=0;i<N;i++){
    const a=-Math.PI/2+i*2*Math.PI/N;
    axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(a))+'" y2="'+(cy+r*Math.sin(a))+'" stroke="#dcebe7" stroke-width="1"/>';
    const lx=cx+(r+18)*Math.cos(a);const ly=cy+(r+18)*Math.sin(a);
    texts+='<text x="'+lx+'" y="'+ly+'" font-size="12" font-weight="700" fill="#3c4a47" text-anchor="middle" dominant-baseline="middle">'+labels[i]+'</text>';
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:'+size+'px">'+grid+axes+'<polygon points="'+dataPts+'" fill="rgba(75,168,156,.28)" stroke="#4ba89c" stroke-width="2"/>'+svgRadarDots(data,cx,cy,r)+texts+'</svg>';
}
function svgRadarDots(data,cx,cy,r){
  const N=data.length;let s='';
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;const rr=r*data[i]/10;s+='<circle cx="'+(cx+rr*Math.cos(a))+'" cy="'+(cy+rr*Math.sin(a))+'" r="2.5" fill="#4ba89c"/>';}
  return s;
}

/* 完整独立 SVG 文档（用于导出 PNG） */
function buildStatsSVG(){
  const heat=statHeat5(28);
  const domains=statDomainRadar();
  const dimsW=dimCountDays(weekDayStrs());
  const dimsM=dimCountDays(monthDayStrs());

  const W=900;let y=40;
  let parts=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' 1240" width="'+W+'" style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f9f6">'];
  parts.push('<rect width="'+W+'" height="1240" fill="#f5f9f6"/>');
  parts.push('<text x="40" y="'+y+'" font-size="22" font-weight="800" fill="#31514a">艾米人生管理系统 · 数据图表</text>');
  parts.push('<text x="'+W+'" y="'+y+'" font-size="12" fill="#7d9890" text-anchor="end">'+today()+'</text>');
  y+=30;

  function box(title,sub){
    parts.push('<rect x="30" y="'+y+'" width="'+(W-60)+'" height="auto" rx="16" fill="#fff" stroke="#e2ece6"/>');
    parts.push('<text x="48" y="'+(y+24)+'" font-size="15" font-weight="800" fill="#31514a">'+title+'</text>');
    if(sub)parts.push('<text x="'+(W-48)+'" y="'+(y+24)+'" font-size="11" fill="#7d9890" text-anchor="end">'+sub+'</text>');
    y+=44;
  }

  /* 1. 雷达（直接画在父坐标系，避免嵌套 svg 高度坍缩） */
  box('八大领域满意度雷达','当前季度自评');
  const radarCx=450,radarCy=y+90,r=64;
  const labels8=['健康','家庭','事业','副业','学习','财务','社交','生活'];
  const dvals=domains.map(d=>+d.s||0);
  // 5 圈网格
  for(let lvl=1;lvl<=5;lvl++){
    const rr=r*lvl/5;const pts=[];
    for(let i=0;i<8;i++){const a=-Math.PI/2+i*2*Math.PI/8;pts.push((radarCx+rr*Math.cos(a))+','+(radarCy+rr*Math.sin(a)));}
    parts.push('<polygon points="'+pts.join(' ')+'" fill="none" stroke="#d8e6e0" stroke-width="1"/>');
  }
  // 8 轴
  for(let i=0;i<8;i++){const a=-Math.PI/2+i*2*Math.PI/8;parts.push('<line x1="'+radarCx+'" y1="'+radarCy+'" x2="'+(radarCx+r*Math.cos(a))+'" y2="'+(radarCy+r*Math.sin(a))+'" stroke="#dcebe7" stroke-width="1"/>');}
  // 数据多边形 + 8 个数据点
  const dataPts=[];
  for(let i=0;i<8;i++){const a=-Math.PI/2+i*2*Math.PI/8;const rr=r*dvals[i]/10;dataPts.push((radarCx+rr*Math.cos(a))+','+(radarCy+rr*Math.sin(a)));}
  parts.push('<polygon points="'+dataPts.join(' ')+'" fill="rgba(58,168,135,.28)" stroke="#3aa887" stroke-width="2"/>');
  for(let i=0;i<8;i++){
    const a=-Math.PI/2+i*2*Math.PI/8;const rr=r*dvals[i]/10;
    parts.push('<circle cx="'+(radarCx+rr*Math.cos(a))+'" cy="'+(radarCy+rr*Math.sin(a))+'" r="2.6" fill="#3aa887"/>');
  }
  // 8 个标签（在轴外侧）
  for(let i=0;i<8;i++){
    const a=-Math.PI/2+i*2*Math.PI/8;
    const lx=radarCx+(r+18)*Math.cos(a),ly=radarCy+(r+18)*Math.sin(a);
    parts.push('<text x="'+lx+'" y="'+ly+'" font-size="12" font-weight="700" fill="#31514a" text-anchor="middle" dominant-baseline="middle">'+labels8[i]+'</text>');
  }
  y+=200;

  /* 2. 五维分布（本周 + 本月） */
  function drawDims(title,sub,counts){
    box(title,sub);
    DIMS.forEach(([k,nm,col])=>{
      const v=counts[k];const maxV=Math.max(v,1);
      parts.push('<text x="60" y="'+(y+14)+'" font-size="12" font-weight="700" fill="'+col+'">'+nm+'</text>');
      parts.push('<rect x="140" y="'+(y+4)+'" width="620" height="14" rx="7" fill="#eef1ee"/>');
      parts.push('<rect x="140" y="'+(y+4)+'" width="'+(620*v/maxV)+'" height="14" rx="7" fill="'+col+'" opacity="0.85"/>');
      parts.push('<text x="780" y="'+(y+16)+'" font-size="12" font-weight="800" fill="#31514a">'+v+'</text>');
      y+=26;
    });
    y+=16;
  }
  drawDims('本周五维行动分布','身体/行为/执行/思维/业务',dimsW);
  drawDims('本月五维行动分布','近 30 天汇总',dimsM);

  /* 3. 习惯热力图 */
  box('习惯打卡热力图','近 28 天 × 五维');
  const cellW=24;const startX=160;
  DIMS.forEach(([k,nm,col])=>{
    parts.push('<text x="80" y="'+(y+18)+'" font-size="12" font-weight="700" fill="'+col+'">'+nm+'</text>');
    heat[k].forEach((c,i)=>{
      const alpha=c.n?Math.min(1,0.35+c.n*0.22):0.08;
      parts.push('<rect x="'+(startX+i*cellW)+'" y="'+(y+4)+'" width="'+(cellW-3)+'" height="22" rx="4" fill="'+col+'" opacity="'+alpha+'"/>');
    });
    y+=30;
  });
  y+=10;

  /* footer */
  parts.push('<text x="40" y="'+(y+12)+'" font-size="10" fill="#7d9890">艾米人生管理系统 v1.6 · 数据保存在本地浏览器</text>');
  parts.push('</svg>');
  return parts.join('');
}

/* 导出统计图片：SVG → Canvas → PNG */
function exportStatsImage(){
  const svgStr=buildStatsSVG();
  const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=function(){
    const canvas=document.createElement('canvas');
    canvas.width=900;canvas.height=Math.round(img.height*900/img.width);
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#f5f7f2';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    canvas.toBlob(function(b){
      if(!b){alert('导出失败');return;}
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='艾米数据图表-'+today()+'.png';a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    },'image/png');
    URL.revokeObjectURL(url);
  };
  img.onerror=function(){alert('生成失败，请重试');URL.revokeObjectURL(url);};
  img.src=url;
}

/* 导出统计 CSV */
function exportStatsCSV(){
  const lines=['类型,日期,维度/类别,数值'];

  habitRate.forEach(s=>lines.push('习惯打卡率,'+s.date+',整体,'+s.pct+'%'));
  const dailyDone=statDailyDoneRate(30);
  dailyDone.forEach(s=>lines.push('每日完成率,'+s.date+',待办,'+s.done+'/'+s.total));
  const dimsM=dimCountDays(monthDayStrs());
  DIMS.forEach(d=>lines.push('本月五维,本月,'+d[1]+','+dimsM[d[0]]));
  S.lifeGuide.domains.forEach(d=>lines.push('八大领域满意度,当前,'+d.n+','+d.s));
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='艾米数据统计-'+today()+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
